<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0b2e">
<meta name="description" content="Arktrix - ad-free Arkanoid-style brick breaker. Installable, plays offline.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arktrix">
<title>Arktrix</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a0b2e; overflow: hidden; touch-action: none; overscroll-behavior: none; font-family: system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
</style></head>
<body><div id="wrap"><div id="stage"><canvas id="game"></canvas></div></div>
<script type="module">
  import { mount } from './game.js';
  mount(document.getElementById('stage'), document.getElementById('game'));
</script>
<script>
  // Register the offline service worker once the page has loaded (no-op on unsupported browsers / insecure origins).
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script></body></html>
